name: Build CV

# Recompile cv.pdf whenever cv.tex changes (or this workflow itself),
# then commit the updated PDF back to the branch so GitHub Pages serves it.

on:
  push:
    paths:
      - 'cv.tex'
      - '.github/workflows/build-cv.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile cv.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          # Two passes for hyperref outlines and any cross-references.
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Commit refreshed cv.pdf
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          if git diff --cached --quiet; then
            echo "cv.pdf is already up to date."
          else
            git commit -m "ci: rebuild cv.pdf"
            git push
          fi
